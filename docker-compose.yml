services:
  mongodb:
    image: mongo:7
    container_name: contextswitch-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cs_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cs_password_2024}
      MONGO_INITDB_DATABASE: contextswitch
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cs-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contextswitch-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USER:-cs_admin}:${MONGO_PASSWORD:-cs_password_2024}@mongodb:27017/contextswitch?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cs-network

volumes:
  mongo_data:
    driver: local

networks:
  cs-network:
    driver: bridge
